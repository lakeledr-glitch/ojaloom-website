<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Something good is coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#EAF1FF; --line:rgba(18,48,122,.14); --ink:#12307A; --muted:#3D5A9E; --card:#FFFFFF; --hat:#FFC933;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0C1D52; --line:rgba(190,215,255,.16); --ink:#EAF1FF; --muted:#A9C0F0; --card:#14296F; }
}
:root[data-theme="dark"]{ --bg:#0C1D52; --line:rgba(190,215,255,.16); --ink:#EAF1FF; --muted:#A9C0F0; --card:#14296F; }

*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; min-height:100%;
  display:grid; place-items:center;
  padding:24px 20px 40px;
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:1.0625rem; line-height:1.55;
}
main{ width:100%; max-width:560px; text-align:center; }

.stage{ position:relative; display:inline-block; padding-top:76px; }
.bubble{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:max-content; max-width:min(300px, 80vw);
  background:var(--card); color:var(--ink);
  border:2px solid var(--ink); border-radius:16px;
  padding:10px 16px; font-weight:500; line-height:1.35;
}
.bubble::after{
  content:""; position:absolute; left:50%; bottom:-9px;
  width:14px; height:14px; background:var(--card);
  border-right:2px solid var(--ink); border-bottom:2px solid var(--ink);
  transform:translateX(-50%) rotate(45deg);
}
.bubble.pop{ animation:pop .22s ease-out; }
@keyframes pop{ from{ transform:translateX(-50%) scale(.92); } to{ transform:translateX(-50%) scale(1); } }

.avatar{
  display:block; width:min(220px, 56vw); margin:0 auto; padding:0;
  background:none; border:0; border-radius:50%; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.avatar:focus-visible{ outline:3px solid var(--hat); outline-offset:6px; }
.avatar svg{ display:block; width:100%; height:auto; }
.eye{ transform-box:fill-box; transform-origin:center; transition:transform .08s ease-out; }
.eye.blink{ transform:scaleY(.08); }
.hint{ margin:10px 0 0; font-size:.875rem; color:var(--muted); }

h1{
  margin:28px 0 12px;
  font-family:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  font-weight:800; font-size:clamp(2.25rem, 8vw, 3.75rem);
  line-height:1.04; letter-spacing:-.025em;
}
.lede{ margin:0 auto; max-width:30em; color:var(--muted); }

.bar{
  width:min(320px, 80%); height:16px; margin:32px auto 0;
  border:2px solid var(--ink); border-radius:999px; overflow:hidden;
}
.bar i{
  display:block; width:100%; height:100%;
  background:repeating-linear-gradient(-45deg, var(--hat) 0 12px, var(--ink) 12px 24px);
  background-size:34px 34px;
  animation:work 1.1s linear infinite;
}
@keyframes work{ to{ background-position:34px 0; } }

@media (prefers-reduced-motion:reduce){
  .bar i{ animation:none; }
  .bubble.pop{ animation:none; }
  .eye{ transition:none; }
}
</style>
</head>
<body>
<main>
  <div class="stage">
    <div class="bubble" id="bubble" aria-live="polite">Hi! Hard hat on. We're building.</div>
    <button class="avatar" id="avatar" type="button" aria-label="Builder avatar. Press to hear another message.">
      <svg viewBox="0 0 200 220" aria-hidden="true">
        <defs><clipPath id="bodyClip"><path d="M24 220C24 172 60 150 100 150C140 150 176 172 176 220Z"/></clipPath></defs>
        <!-- vest -->
        <path d="M24 220C24 172 60 150 100 150C140 150 176 172 176 220Z" fill="#FF8A3D"/>
        <g clip-path="url(#bodyClip)">
          <rect x="0" y="188" width="200" height="9" fill="#FFF1C2"/>
          <rect x="0" y="204" width="200" height="9" fill="#FFF1C2"/>
          <path d="M100 150V220" stroke="#D96A1E" stroke-width="3"/>
        </g>
        <!-- neck + head -->
        <rect x="86" y="130" width="28" height="26" rx="8" fill="#D98F63"/>
        <circle cx="54" cy="106" r="9" fill="#E09A6C"/>
        <circle cx="146" cy="106" r="9" fill="#E09A6C"/>
        <circle cx="100" cy="100" r="46" fill="#E8A87C"/>
        <!-- face -->
        <g class="eye"><circle cx="84" cy="108" r="9" fill="#fff"/><circle class="pupil" cx="84" cy="108" r="4.5" fill="#1B2A4A"/></g>
        <g class="eye"><circle cx="116" cy="108" r="9" fill="#fff"/><circle class="pupil" cx="116" cy="108" r="4.5" fill="#1B2A4A"/></g>
        <circle cx="72" cy="124" r="6" fill="#F08A7A" opacity=".45"/>
        <circle cx="128" cy="124" r="6" fill="#F08A7A" opacity=".45"/>
        <path d="M87 127Q100 140 113 127" fill="none" stroke="#7A3E1D" stroke-width="3.5" stroke-linecap="round"/>
        <!-- hard hat -->
        <path d="M52 88C52 54 76 38 100 38C124 38 148 54 148 88Z" fill="#FFC933"/>
        <rect x="91" y="32" width="18" height="34" rx="7" fill="#F2B300"/>
        <rect x="42" y="84" width="116" height="13" rx="6.5" fill="#F2B300"/>
      </svg>
    </button>
    <p class="hint">Tap the builder to say hi.</p>
  </div>

  <h1>Something good is coming soon.</h1>
  <p class="lede">This website is still in development. We're putting the pieces together and will open the doors as soon as it's ready.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
</main>

<script>
(function(){
  var av = document.getElementById('avatar');
  var bubble = document.getElementById('bubble');
  var pupils = document.querySelectorAll('.pupil');
  var eyes = document.querySelectorAll('.eye');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lines = [
    "Hi! Hard hat on. We're building.",
    "Good things take a little time.",
    "Pages are going up as we speak.",
    "Come back soon. It'll be worth it."
  ];
  var n = 0;

  function look(x, y){
    var r = av.getBoundingClientRect();
    var dx = x - (r.left + r.width / 2);
    var dy = y - (r.top + r.height * 0.5);
    var d = Math.hypot(dx, dy) || 1;
    var m = Math.min(4, d / 40);
    var t = 'translate(' + (dx / d * m).toFixed(2) + ' ' + (dy / d * m).toFixed(2) + ')';
    pupils.forEach(function(p){ p.setAttribute('transform', t); });
  }
  window.addEventListener('pointermove', function(e){ look(e.clientX, e.clientY); });
  window.addEventListener('pointerdown', function(e){ look(e.clientX, e.clientY); });

  function blink(){
    eyes.forEach(function(e){ e.classList.add('blink'); });
    setTimeout(function(){ eyes.forEach(function(e){ e.classList.remove('blink'); }); }, 140);
    setTimeout(blink, 2500 + Math.random() * 3000);
  }
  if(!reduce){ setTimeout(blink, 2000); }

  av.addEventListener('click', function(){
    n = (n + 1) % lines.length;
    bubble.textContent = lines[n];
    bubble.classList.remove('pop');
    void bubble.offsetWidth;
    bubble.classList.add('pop');
  });
})();
</script>
</body>
</html>
